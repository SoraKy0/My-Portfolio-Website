<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">

    <title>Kshan's Portfolio</title>
</head>
<body>
    <section class = "background">
        <div class = "sun"></div>

        <div class = "cloud-one"></div>
        <div class = "cloud-two"></div>
        <div class = "cloud-three"></div>

        <div class="cloud-small-1"></div>
        <div class="cloud-small-2"></div>
        <div class="cloud-small-3"></div>
        <div class="cloud-small-4"></div>
        <div class="cloud-small-5"></div>

        <div class = "hill-left"></div>
        <div class = "hill-right"></div>
        <div class = "stone-fence"> </div>
        <div class = "stone-fence-head"> </div>
    </section>

    <div class = "rock-floor"></div>

    <main class = "shop">
        <div class = "roof"><!--Traditional Japanese roof kinda-->
            <div class = "roof-bottom-bar"></div>
        </div>

        <div class = "shop-body">

            <div class="lantern">
                <div class="wood-base"></div> 
                <div class="wood-base-small"></div> 
                <div class="wood-column"></div> <div class="lamp"></div>
                <div class="cross-beam-vertical"></div>
                <div class="cross-beam-horizonal"></div>
                <div class="lamp-roof"></div>    
            </div>

            <div class = "left-wall"></div>
        
            <div class = "right-wall"></div>

            <div class = "back-wall"></div>

            <div class="window-frame"></div>
            
            <div class = "floor"></div>

            <section class = "shop-banner">
                <h1>Kshananth Jeyamohan</h1> <!--This will go in the shops banner connected to roof-->
            </section>
            <div class = "banner-rope-one"></div>
            <div class = "banner-rope-two"></div>

            <div class="menu"></div>
            <div class="bell"></div>
            <div class="till">
                <div class="till-screen">£20.06</div>
            </div>
            <div class = "counter-topper"></div>


            <section class="counter">

            <div class="about-me-box">
                <h3>About Me</h3>
                <p>Hello, I am a third year CS student :(</p>
            </div>

            </section>


            <div class="light-wire"></div>
            <div class="light"></div>
            <div class="light-rays-glow"></div>
            <div class="light-rays"></div>
            

            <section class="projects-shelf">
                <div class="shelf-middle"></div>
                <div class="shelf-floor"></div>
                <div class="shelf-row shelf-row-top">
                    <div class="project-slot"></div>
                    <div class="project-slot"></div>
                    <div class="project-slot"></div>
                </div>
                <div class="shelf-row shelf-row-bottom">
                    <div class="project-slot"></div>
                    <div class="project-slot"></div>
                    <div class="project-slot"></div>
                </div>
            </section>

            <div class="shelf-wall-left"></div>
            <div class="under-shelf-wall"></div>
            <div class="cat"></div>

        </div>
    </main>
</body>
</html>
