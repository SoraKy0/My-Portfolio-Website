<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <section class = "background">
        <div class = "sun"></div>
        <div class = "cloud-one"></div>
        <div class = "cloud-two"></div>
        <div class = "cloud-three"></div>
        <div class = "hill-left"></div>
        <div class = "hill-right"></div>
        <div class = "stone-fence"> </div>

    <div class = "rock-floor"></div>

        </div>

        <div class = "shop-body">

            <div class="lantern">

                <div class="wood-base-small"></div>

            <div class = "back-wall"></div>
            
            <div class = "floor"></div>

            <section class = "shop-banner">

            </section>
            <div class = "banner-rope-one"></div>
            <div class = "banner-rope-two"></div>

            <section class="counter">
    
            <section class="menu"></section>
            <section class="bell"></section>
            <section class="till"></section>

            <div class="about-me-box">
                <h2>About Me</h2>
                <p>Hello, I am a third year CS student :(</p>
            </div>

            </section>


            <div class="light-wire"></div>
            <div class="light"></div>
            <div class="light-rays-glow"></div>
            <div class="light-rays">...</div>
            

            <section class="projects-shelf">
                <div class="shelf-middle"></div>
                <div class="shelf-floor"></div>
            </section>

            <div class="shelf-wall-left"></div>
            <div class="under-shelf-wall"></div>
            <div class="cat"></div>

        </div>
    </main>

</html>
